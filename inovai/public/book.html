<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termin buchen – {{NAME}}</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{margin:0;background:#f4f5f7;color:#1c1c1c}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.card{background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:22px}
h1{font-size:22px;margin:0 0 4px}.sub{color:#667;margin:0 0 18px;font-size:14px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.day{flex:0 0 auto;border:1px solid #d5d9df;background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;text-align:center;font-size:13px;min-width:74px}
.day b{display:block;font-size:16px}.day.sel{background:{{COLOR}};border-color:{{COLOR}};color:#fff}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:16px}
.time{border:1px solid #d5d9df;background:#fff;border-radius:10px;padding:10px;cursor:pointer;font-size:14px}
.time.sel{background:{{COLOR}};border-color:{{COLOR}};color:#fff}
form{display:none;flex-direction:column;gap:10px}form.show{display:flex}
input,textarea{border:1px solid #d5d9df;border-radius:10px;padding:11px 12px;font-size:15px;width:100%}
label.c{font-size:12.5px;color:#556;display:flex;gap:8px;align-items:flex-start}
button.go{background:{{COLOR}};color:#fff;border:0;border-radius:12px;padding:13px;font-size:16px;cursor:pointer}
.msg{padding:12px;border-radius:10px;font-size:14px;margin-top:10px}.ok{background:#e6f7ec;color:#18794e}.bad{background:#fdecec;color:#b42318}
.empty{color:#667;font-size:14px}.foot{text-align:center;font-size:12px;color:#889;margin-top:16px}.foot a{color:#889}
</style></head>
<body><div class="wrap"><div class="card">
<h1>Termin buchen</h1><p class="sub" id="sub">{{NAME}} · {{ADDRESS}}</p>
<div id="picker"><div class="days" id="days"></div><div class="times" id="times"><span class="empty">Lade freie Termine …</span></div></div>
<form id="f">
  <div id="chosen" style="font-weight:600"></div>
  <input name="name" placeholder="Ihr Name" autocomplete="name" required>
  <input name="phone" placeholder="Telefon (für Bestätigung)" autocomplete="tel">
  <input name="email" type="email" placeholder="E-Mail" autocomplete="email">
  <textarea name="reason" placeholder="Worum geht es? (optional)" rows="2"></textarea>
  <input name="website" style="display:none" tabindex="-1" autocomplete="off">
  <label class="c"><input type="checkbox" name="consent" required> <span>Ich bin einverstanden, dass {{NAME}} mich zu diesem Termin per SMS/E-Mail/Telefon kontaktiert. <a href="{{PRIVACY}}" target="_blank" rel="noopener">Datenschutz</a></span></label>
  <button class="go" type="submit">Termin verbindlich buchen</button>
</form>
<div id="out"></div>
</div><div class="foot">Terminbuchung bereitgestellt von INOVai</div></div>
<script>
(function(){
var T='{{TENANT}}', qs=new URLSearchParams(location.search), C=qs.get('c')||'', SRC=qs.get('src')||'';
var byDay={}, sel=null, $=function(id){return document.getElementById(id)};
var f=$('f');
if(C) fetch('/api/public/'+T+'/me?c='+encodeURIComponent(C)).then(r=>r.json()).then(m=>{ if(m.name){ $('sub').textContent='Hallo '+m.name.split(' ')[0]+' – wählen Sie einfach eine Zeit.'; f.name.value=m.name; } if(m.hasPhone||m.hasEmail){ f.phone.placeholder='Telefon (bereits hinterlegt)'; f.email.placeholder='E-Mail (optional)'; } });
fetch('/api/public/'+T+'/slots?days=21').then(r=>r.json()).then(function(d){
  (d.slots||[]).forEach(function(s){ var k=s.label.split(',').slice(0,2).join(','); (byDay[k]=byDay[k]||[]).push(s); });
  var keys=Object.keys(byDay); if(!keys.length){ $('times').innerHTML='<span class="empty">Aktuell sind online keine Termine frei. Bitte rufen Sie uns an.</span>'; return; }
  keys.forEach(function(k,i){ var p=k.split(', '); var b=document.createElement('button'); b.className='day'; b.innerHTML=p[0].slice(0,2)+'<b>'+p[1].slice(0,5)+'</b>'; b.onclick=function(){ showDay(k,b) }; $('days').appendChild(b); if(!i) showDay(k,b); });
});
function showDay(k,btn){ document.querySelectorAll('.day').forEach(x=>x.classList.remove('sel')); btn.classList.add('sel'); $('times').innerHTML='';
  byDay[k].forEach(function(s){ var b=document.createElement('button'); b.className='time'; b.textContent=s.label.split(', ').pop().replace(' Uhr',''); b.onclick=function(){ document.querySelectorAll('.time').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=s; $('chosen').textContent='📅 '+s.label; f.classList.add('show'); f.name.focus(); }; $('times').appendChild(b); }); }
f.onsubmit=function(e){ e.preventDefault(); if(!sel) return; var d=Object.fromEntries(new FormData(f)); if(!C && !d.phone && !d.email){ return show('Bitte Telefon oder E-Mail angeben.',false); }
  f.querySelector('button').disabled=true;
  fetch('/api/public/'+T+'/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign(d,{start:sel.start,c:C,src:SRC}))}).then(r=>r.json()).then(function(r){
    f.querySelector('button').disabled=false;
    if(r.ok){ $('picker').style.display='none'; f.classList.remove('show'); show('✅ Ihr Termin am '+r.label+' ist gebucht. Sie erhalten eine Bestätigung.',true); }
    else { show(r.error||'Buchung fehlgeschlagen',false); }
  }).catch(function(){ f.querySelector('button').disabled=false; show('Verbindung fehlgeschlagen',false) });
};
function show(t,ok){ $('out').innerHTML='<div class="msg '+(ok?'ok':'bad')+'"></div>'; $('out').firstChild.textContent=t; }
})();
</script></body></html>
