<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}} – Demo-Website mit INOVai Assistent</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{margin:0;color:#1c1c1c;background:#fff}
.bar{background:#111;color:#ffd43b;font-size:13px;text-align:center;padding:8px}
header{padding:22px 6vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}header b{font-size:20px}
.hero{padding:70px 6vw;background:linear-gradient(135deg,#fff4e6,#ffe8cc)}.hero h1{font-size:40px;margin:0 0 10px;max-width:760px}.hero p{font-size:18px;color:#444;max-width:640px}
.cta{display:inline-block;margin-top:16px;margin-right:10px;padding:13px 20px;border-radius:12px;background:#d9480f;color:#fff;text-decoration:none;border:0;font-size:16px;cursor:pointer}
.cta.alt{background:#fff;color:#d9480f;border:2px solid #d9480f}
section{padding:40px 6vw}ul.s{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}ul.s li{border:1px solid #eee;border-radius:14px;padding:16px;line-height:1.5}
footer{padding:30px 6vw;background:#f7f7f7;font-size:14px;color:#555}
</style></head><body>
<div class="bar">DEMO · Diese Seite zeigt den INOVai Website-Assistenten (unten rechts) – Text, Voice, Terminbuchung & Lead-Erfassung.</div>
<header><b>{{NAME}}</b><span>📞 {{PHONE}}</span></header>
<div class="hero"><h1>{{SLOGAN}}</h1><p>{{BRANCHE}} · {{ADDRESS}}</p>
<button class="cta" onclick="INOVai.ask('Ich möchte einen Termin buchen')">Termin online buchen</button>
<button class="cta alt" onclick="INOVai.voice()">🎙️ Mit dem Assistenten sprechen</button></div>
<section><h2>Unsere Leistungen</h2><ul class="s">{{SERVICES}}</ul></section>
<footer>{{NAME}} · {{ADDRESS}} · {{PHONE}}</footer>
<script src="/widget.js" data-tenant="{{TENANT}}" async></script>
</body></html>
